<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1E293B">
<meta name="author" content="SIAS LTDA">
<meta name="description" content="Documentos legais da plataforma VoxCivis · SIAS LTDA · CNPJ 59.999.302/0001-68">
<title>{{ page.title }} | VoxCivis · Documentos Legais</title>
<link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; line-height: 1.65; color: #1E293B; background: #F8FAFC; -webkit-font-smoothing: antialiased; }
  .site-header { background: #1E293B; padding: 24px 0 18px; }
  .header-inner { max-width: 820px; margin: 0 auto; padding: 0 28px; }
  .brand-row { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .brand-logo { height: 42px; width: auto; display: block; }
  .brand-beta { display: inline-block; border: 1px solid rgba(255,255,255,0.55); color: #fff; font-size: 11px; font-weight: 500; padding: 3px 12px; border-radius: 14px; letter-spacing: 1.2px; }
  .brand-tagline { margin: 0; font-size: 13px; font-style: italic; color: rgba(255,255,255,0.7); letter-spacing: 0.3px; }
  .content { max-width: 820px; margin: 0 auto; padding: 36px 28px 48px; background: #fff; }
  .content-wrap { background: #fff; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 12px; color: #1E293B; line-height: 1.3; }
  h2 { font-size: 21px; font-weight: 600; margin: 32px 0 12px; color: #1E293B; padding-top: 8px; }
  h3 { font-size: 17px; font-weight: 600; margin: 24px 0 10px; color: #1E293B; }
  h4 { font-size: 15px; font-weight: 600; margin: 18px 0 8px; color: #334155; }
  p { margin: 0 0 14px; }
  a { color: #185FA5; text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul, ol { padding-left: 22px; margin: 0 0 14px; }
  li { margin-bottom: 6px; }
  blockquote { border-left: 3px solid #7BBEEB; background: #F1F5F9; margin: 16px 0; padding: 12px 18px; color: #334155; border-radius: 0 6px 6px 0; }
  code { background: #F1F5F9; padding: 2px 6px; border-radius: 4px; font-size: 0.92em; font-family: "SF Mono", Menlo, Consolas, monospace; }
  pre { background: #1E293B; color: #E2E8F0; padding: 14px 16px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
  pre code { background: transparent; color: inherit; padding: 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
  th, td { border: 1px solid #E2E8F0; padding: 8px 12px; text-align: left; vertical-align: top; }
  th { background: #F1F5F9; font-weight: 600; }
  hr { border: none; border-top: 1px solid #E2E8F0; margin: 28px 0; }
  .site-footer { background: #1E293B; color: rgba(255,255,255,0.75); padding: 22px 0; font-size: 13px; }
  .footer-inner { max-width: 820px; margin: 0 auto; padding: 0 28px; display: flex; flex-wrap: wrap; gap: 18px; justify-content: space-between; }
  .footer-block p { margin: 0 0 3px; }
  .footer-block .label { color: #fff; font-weight: 500; }
  .footer-block a { color: #85B7EB; }
  @media (max-width: 600px) {
    .header-inner, .content, .footer-inner { padding-left: 18px; padding-right: 18px; }
    h1 { font-size: 24px; }
    .brand-logo { height: 36px; }
    .footer-inner { flex-direction: column; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand-row">
      <a href="{{ '/' | relative_url }}"><img src="{{ '/assets/logo-voxcivis-white.png' | relative_url }}" alt="VoxCivis" class="brand-logo"></a>
      <span class="brand-beta">BETA</span>
    </div>
    <p class="brand-tagline">Inteligência Territorial com IA</p>
  </div>
</header>

<main class="content-wrap">
  <article class="content">
    {{ content }}
  </article>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-block">
      <p class="label">SIAS LTDA</p>
      <p>CNPJ 59.999.302/0001-68 · Brasília/DF, Brasil</p>
      <p><a href="https://voxcivis.ai">voxcivis.ai</a></p>
    </div>
    <div class="footer-block">
      <p class="label">Contatos</p>
      <p>DPO · <a href="mailto:dpo@voxcivis.ai">dpo@voxcivis.ai</a></p>
      <p>Atendimento · <a href="mailto:atendimento@voxcivis.ai">atendimento@voxcivis.ai</a></p>
    </div>
  </div>
</footer>

</body>
</html>
